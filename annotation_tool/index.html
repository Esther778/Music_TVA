<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>歌曲 Section 人工质检台</title>
    <link rel="stylesheet" href="./styles.css?v=20260610-readable-count1" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div>
            <h1>Section 质检台</h1>
            <p>确认机器切分，修正错误段落，写入 Supabase</p>
          </div>
          <button id="refreshButton" title="刷新 Supabase 数据" aria-label="刷新 Supabase 数据" data-tooltip="刷新 Supabase 数据">↻</button>
        </div>
        <div class="summary-grid">
          <button type="button" class="summary-card active" data-song-filter="all"><span id="songCount">0</span><label>全部歌曲</label></button>
          <button type="button" class="summary-card" data-song-filter="pending"><span id="pendingCount">0</span><label>未质检</label></button>
          <button type="button" class="summary-card" data-song-filter="reviewed"><span id="reviewedCount">0</span><label>已质检</label></button>
          <div><span id="actionCount">0/0</span><label>当前歌曲质检</label></div>
        </div>
        <div id="selectedSongCard" class="selected-song-card">未选择歌曲</div>
        <label class="field-label" for="songPicker">选择需要质检的歌曲</label>
        <input id="songPicker" class="text-input" list="songOptions" placeholder="输入歌名 / 歌手 / id 搜索" />
        <datalist id="songOptions"></datalist>
        <input id="statusFilter" type="hidden" value="all" />
        <input id="reviewFilter" type="hidden" value="all" />
        <button id="songDirectoryTitle" type="button" class="directory-title">全部歌曲目录</button>
        <div id="songDirectory" class="song-directory"></div>
      </aside>

      <main class="workspace">
        <section class="audio-panel">
          <audio id="audioPlayer" preload="metadata"></audio>
          <div class="transport">
            <button id="playToggle" type="button" title="播放/暂停">▶</button>
            <time id="currentTimeText">0:00:00</time>
            <input id="progressRange" type="range" min="0" max="0" step="0.01" value="0" aria-label="播放进度" />
            <time id="durationText">0:00:00</time>
            <button id="speedToggle" type="button" class="speed-toggle" title="切换播放倍速">1x</button>
          </div>
          <div id="timeline" class="timeline"></div>
          <div class="timeline-tools">
            <button id="zoomOut" type="button">缩小</button>
            <input id="zoomRange" type="range" min="1" max="8" step="0.5" value="1" aria-label="时间轴缩放" />
            <button id="zoomIn" type="button">放大</button>
          </div>
          <div class="lyrics-shell">
            <button id="lyricsExpand" type="button" class="lyrics-expand" title="放大歌词" aria-label="放大歌词">□</button>
            <div id="lyricsViewport" class="lyrics-viewport">选择歌曲后显示歌词</div>
          </div>
        </section>

        <section class="details-grid">
          <section class="panel">
            <div class="panel-head">
              <h3>机器结果 / 当前最终结果</h3>
              <span id="runMeta"></span>
            </div>
            <div id="sectionList" class="section-list empty">选择歌曲后显示模型结果</div>
          </section>

          <section class="panel inspector">
            <div class="panel-head">
              <h3>校准当前section</h3>
              <span id="selectedBadge">未选择</span>
            </div>
            <form id="editForm" class="edit-form">
              <div id="finalResultSummary" class="final-summary">选择左侧 section 后编辑</div>
              <label>Section type</label>
              <div id="typeQuickButtons" class="type-buttons"></div>
              <input id="editType" type="hidden" value="intro" />
              <div class="form-row">
                <div>
                  <label>Start</label>
                  <input id="editStart" type="text" inputmode="numeric" placeholder="2:45:00" />
                </div>
                <div>
                  <label>End</label>
                  <input id="editEnd" type="text" inputmode="numeric" placeholder="3:12:56" />
                </div>
              </div>
              <div class="form-actions">
                <button type="button" id="seekStart">跳到开头</button>
                <button type="button" id="useModel">恢复机器</button>
                <button type="button" id="addSection">新增 Section</button>
                <button type="button" id="deleteSection">删除段落</button>
                <button type="button" id="resetCurrentSection">重置当前section</button>
                <button type="button" id="resetSong">重置整首歌</button>
                <button type="submit" id="saveEdit">提交本段</button>
                <button type="button" id="finishReview">提交整首歌</button>
                <button type="button" id="markPendingReview">标为未质检</button>
              </div>
            </form>
            <div class="evidence">
              <h4>Model evidence</h4>
              <dl>
                <dt>Boundary confidence</dt><dd id="boundaryConfidence">-</dd>
                <dt>Type confidence</dt><dd id="typeConfidence">-</dd>
                <dt>Review flag</dt><dd id="reviewFlag">-</dd>
                <dt>Lyric</dt><dd id="lyricEvidence">-</dd>
                <dt>Vocal</dt><dd id="vocalEvidence">-</dd>
                <dt>Acoustic</dt><dd id="acousticEvidence">-</dd>
              </dl>
            </div>
          </section>
        </section>
      </main>
    </div>

    <div id="lyricsModal" class="lyrics-modal" aria-hidden="true">
      <div class="lyrics-modal-panel">
        <div class="lyrics-modal-head">
          <h3>整首歌词校准</h3>
          <div class="lyrics-modal-head-actions">
            <button id="lyricsModalPlay" type="button" title="播放/暂停">▶</button>
            <button id="lyricsModalClose" type="button">关闭</button>
          </div>
        </div>
        <div id="lyricsBulkList" class="lyrics-bulk-list"></div>
        <div class="lyrics-modal-actions">
          <span>可修改时间和歌词，也可新增或删除行。</span>
          <button id="lyricsBulkAdd" type="button">新增歌词行</button>
          <button id="lyricsBulkSave" type="button">保存歌词</button>
        </div>
        <div id="lyricsModalResize" class="lyrics-modal-resize" aria-hidden="true"></div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
    <div id="bottomPlayer" class="bottom-player" aria-hidden="true">
      <button id="bottomPlayToggle" type="button" title="播放/暂停">▶</button>
      <time id="bottomCurrentTimeText">0:00:00</time>
      <input id="bottomProgressRange" type="range" min="0" max="0" step="0.01" value="0" aria-label="底部播放进度" />
      <time id="bottomDurationText">0:00:00</time>
      <button id="bottomSpeedToggle" type="button" class="speed-toggle" title="切换播放倍速">1x</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./app.js?v=20260610-readable-count1"></script>
  </body>
</html>
